# Fly.io configuration. Steps (see README "Deploying"):
#   fly launch --copy-config --no-deploy --name <your-app-name>
#   fly volumes create wispr_data --size 1
#   fly secrets set WISPR_PASSWORD=<choose one, 12+ characters> OPENAI_API_KEY=... ANTHROPIC_API_KEY=...
#   fly deploy
app = "wispr-clone"
primary_region = "lhr"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  WISPR_DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[mounts]
  source = "wispr_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
